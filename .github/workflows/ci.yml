name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest
      - name: Dependency audit
        run: pip-audit -r requirements-dev.txt --no-deps --disable-pip --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start, wait until healthy
        run: docker compose up -d --build --wait --wait-timeout 60
      - name: Call the health endpoint
        run: curl -sf http://localhost:8000/health
      - name: Fetch the UI page
        run: curl -sf -o /dev/null http://localhost:8000/
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
